<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FONEX | Advanced Media Extractor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        :root { --primary: #00ff88; --secondary: #00e5ff; --bg: #050505; }
        body { background-color: var(--bg); font-family: 'Inter', sans-serif; color: #e0e0e0; overflow-x: hidden; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        
        .bg-mesh {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(0, 255, 136, 0.05) 0%, transparent 40%),
                        radial-gradient(circle at 80% 70%, rgba(0, 229, 255, 0.05) 0%, transparent 40%);
            z-index: -1;
        }

        .glass-card {
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #000;
            transition: all 0.3s ease;
        }

        .btn-primary:active { transform: scale(0.98); }

        /* Fix for mobile keyboard pushing content */
        @media (max-height: 700px) {
            .main-container { padding-top: 2rem; padding-bottom: 2rem; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    {% verbatim %}
    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [url, setUrl] = useState('');
            const [taskId, setTaskId] = useState(null);
            const [status, setStatus] = useState('IDLE');
            const [progress, setProgress] = useState(0);
            const [error, setError] = useState('');
            const [isBusy, setIsBusy] = useState(false);
            const [logs, setLogs] = useState(['SYSTEM_ONLINE', 'AWAITING_URL']);

            const addLog = (msg) => {
                setLogs(prev => [...prev, '> ' + msg].slice(-4));
            };

            const startDownload = async () => {
                if (!url) { setError("URL_REQUIRED"); return; }
                setError("");
                setIsBusy(true);
                setProgress(5);
                addLog("INIT_SEQUENCE...");

                try {
                    const res = await fetch('/download/?url=' + encodeURIComponent(url));
                    const data = await res.json();
                    if (data.error) throw new Error(data.error);
                    setTaskId(data.task_id);
                    addLog("TASK_ID: " + data.task_id);
                    pollStatus(data.task_id);
                } catch (err) {
                    setError(err.message);
                    setIsBusy(false);
                    addLog("EXECUTION_FAILED");
                }
            };

            const pollStatus = (id) => {
                const interval = setInterval(async () => {
                    try {
                        const res = await fetch('/status/' + id + '/');
                        const data = await res.json();
                        setProgress(data.progress);
                        setStatus(data.status);

                        if (data.status === "SUCCESS") {
                            clearInterval(interval);
                            addLog("DOWNLOAD_READY");
                        } else if (data.status === "FAILED") {
                            clearInterval(interval);
                            setIsBusy(false);
                            addLog("PROCESS_ABORTED");
                        }
                    } catch (e) { clearInterval(interval); }
                }, 2000);
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4 md:p-8 relative">
                    <div className="bg-mesh"></div>
                    
                    <div className="w-full max-w-lg main-container">
                        <div className="glass-card rounded-3xl overflow-hidden shadow-2xl border border-white/10">
                            
                            <div className="p-6 md:p-10 text-center">
                                <div className="inline-block px-3 py-1 bg-green-500/10 rounded-full text-[10px] text-green-400 font-bold tracking-widest mb-4">
                                    V2.0 STABLE
                                </div>
                                <h1 className="text-3xl md:text-5xl font-black italic text-white tracking-tighter">
                                    FONEX<span className="text-green-400">TROLLS</span>
                                </h1>
                            </div>

                            <div className="px-6 pb-10 md:px-10 space-y-6">
                                <div className="space-y-2">
                                    <label className="text-[10px] font-bold text-zinc-500 uppercase tracking-widest ml-1">Paste Media Link</label>
                                    <input 
                                        className="w-full bg-black/40 border border-white/10 p-4 text-white rounded-2xl focus:border-green-500/50 outline-none transition-all mono text-sm"
                                        placeholder="Instagram, YouTube, Reddit..."
                                        value={url}
                                        onChange={(e) => setUrl(e.target.value)}
                                        disabled={isBusy && status !== 'SUCCESS'}
                                    />
                                </div>

                                <button 
                                    onClick={startDownload}
                                    disabled={isBusy && status !== 'SUCCESS'}
                                    className={"w-full py-4 md:py-5 rounded-2xl text-base font-bold flex items-center justify-center gap-2 " + 
                                        (isBusy && status !== 'SUCCESS' ? "bg-zinc-800 text-zinc-500" : "btn-primary shadow-lg shadow-green-500/20")
                                    }
                                >
                                    {isBusy && status !== 'SUCCESS' ? 'EXTRACTING...' : 'START EXTRACTION'}
                                </button>

                                {/* Terminal Console */}
                                <div className="bg-black/60 rounded-2xl p-4 border border-white/5 mono text-[11px] h-28 flex flex-col justify-end overflow-hidden">
                                    {logs.map((log, i) => (
                                        <div key={i} className={i === logs.length - 1 ? "text-green-400" : "text-zinc-600"}>
                                            {log}
                                        </div>
                                    ))}
                                    {isBusy && status !== 'SUCCESS' && (
                                        <div className="text-cyan-400 animate-pulse mt-1">
                                            > {status}... {progress}%
                                        </div>
                                    )}
                                </div>

                                {isBusy && (
                                    <div className="space-y-6 pt-2">
                                        {/* Progress Bar */}
                                        <div className="h-1.5 w-full bg-zinc-900 rounded-full overflow-hidden">
                                            <div 
                                                className="h-full bg-gradient-to-r from-green-400 to-cyan-400 transition-all duration-500"
                                                style={{ width: progress + '%' }}
                                            ></div>
                                        </div>
                                        
                                        {status === "SUCCESS" && (
                                            <div className="animate-in fade-in zoom-in duration-500 space-y-3">
                                                <a href={"/file/" + taskId + "/"}
                                                    className="flex items-center justify-center w-full py-5 bg-white text-black font-black rounded-2xl hover:bg-green-400 transition-colors shadow-xl text-lg"
                                                >
                                                    DOWNLOAD NOW
                                                </a>
                                                <p className="text-center text-[10px] text-zinc-500 font-bold tracking-widest uppercase">
                                                    File successfully processed

                                                    check out our more tool
                                                                    ~ <button><a href="https://noobdeveloper.pythonanywhere.com/">Qr-maker</a></button>
                                                </p>
                                            </div>
                                        )}
                                    </div>
                                )}

                                {error && (
                                    <div className="bg-red-500/10 border border-red-500/20 text-red-500 text-[10px] p-4 rounded-2xl text-center font-bold mono">
                                        ERROR: {error}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    {% endverbatim %}
</body>
</html>
